name: CLA

# Checks that every pull request author has signed CLA.md. A signature is a comment with the exact sentence
# below; it is recorded in signatures/version1/cla.json on the branch `cla-signatures` (created by the owner
# from main), never on main. `pull_request_target` runs with a write token, so this workflow must never check
# out or run pull request code: it has no checkout step and only calls the pinned action.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write          # re-run the check after a signature comment
      contents: write         # commit signatures to the cla-signatures branch
      pull-requests: write    # comment on the pull request
      statuses: write         # the `cla` commit status
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/productdevbook/fil/blob/main/CLA.md
          branch: cla-signatures
          allowlist: productdevbook,dependabot[bot],github-actions[bot]
