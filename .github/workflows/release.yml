name: Release

# Push a tag `vX.Y.Z` whose version matches Sources/fil/main.swift. The workflow tests, builds, signs and
# notarizes `fil`, publishes the GitHub release and updates the cask in productdevbook/homebrew-tap.
# Only tag pushes run it, so pull requests never see the signing secrets. A manual run (Actions tab)
# tests, builds, signs and notarizes the current version and uploads the tarball as an artifact; it
# publishes nothing (jobs `publish` and `tap` are skipped).
# Recovery: a manual run with `tap_version` (e.g. 0.2.0) runs only `tap`, for that already published
# release: it takes the SHA-256 from the release's .sha256 asset and renders, audits, installs and
# pushes the cask. Nothing is built, signed or published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tap_version:
        description: "Only update the Homebrew cask for this already published release (X.Y.Z, no v). Leave empty to build without publishing."
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Same image as ci.yml: the only hosted one with the macOS 27 SDK.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer

jobs:
  # Nothing is signed unless the release build and the unit tests pass on this commit.
  test:
    if: inputs.tap_version == ''
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then V=${GITHUB_REF_NAME#v}
          else V=$(sed -n 's/^let version = "\(.*\)"$/\1/p' Sources/fil/main.swift); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  build:
    needs: test
    if: inputs.tap_version == ''
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.test.outputs.version }}
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FIL_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FIL_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export FIL_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8
          printf '%s' "$ASC_KEY_P8" > "$FIL_NOTARY_KEY"
          scripts/release.sh "$VERSION"

      - name: Checksum
        id: sum
        run: echo "sha256=$(cut -d' ' -f1 "dist/fil-$VERSION-arm64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - name: List the tarball
        run: tar -tzvf "dist/fil-$VERSION-arm64.tar.gz"

      # For a tag, `publish` downloads this; for a manual run it is the result to inspect: the tarball plus
      # its completions and man page unpacked, so they can be read without extracting.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/fil-${{ env.VERSION }}-arm64.tar.gz
            dist/fil-${{ env.VERSION }}-arm64.tar.gz.sha256
            dist/fil-${{ env.VERSION }}-arm64/completions
            dist/fil-${{ env.VERSION }}-arm64/man
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

  publish:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Verify the checksum
        run: cd dist && sha256sum -c "fil-$VERSION-arm64.tar.gz.sha256"

      # The notes are the `## [X.Y.Z] - date` section of CHANGELOG.md at the tagged commit; a tag without
      # one stops here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          NAME=fil-$VERSION-arm64
          SHA=$(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")
          awk -v v="$VERSION" '
            /^## \[/ { on = (index($0, "## [" v "] - ") == 1); next }
            /^\[[^]]+\]: / { on = 0 }
            on
          ' CHANGELOG.md | sed -e '/./,$!d' > changes.md
          [[ -s changes.md ]] || { echo "::error::no '## [$VERSION] - date' section in CHANGELOG.md"; exit 1; }
          {
            cat changes.md
            printf '\nSigned with a Developer ID and notarized by Apple.\n\n```sh\n'
            printf 'brew install --cask productdevbook/tap/fil\n```\n\n'
            printf 'SHA-256 (%s.tar.gz): `%s`\n' "$NAME" "$SHA"
          } > notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=fil-$VERSION-arm64
          gh release create "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "fil $VERSION" --verify-tag --notes-file notes.md

  tap:
    needs: [test, build, publish]
    # A tag run needs a published release; a recovery run (tap_version) skips the jobs it needs.
    if: ${{ !cancelled() && (inputs.tap_version != '' || (github.event_name == 'push' && needs.publish.result == 'success')) }}
    runs-on: xcode-27
    timeout-minutes: 20
    # contents: read for `gh release view/download` and `gh api`; the cask is pushed with the deploy key.
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.tap_version || needs.test.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # SHA256 comes from the build for a tag run, from the published .sha256 asset for a recovery run.
      - name: Resolve the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA256: ${{ needs.build.outputs.sha256 }}
          RECOVERY: ${{ inputs.tap_version != '' }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          if [[ $RECOVERY == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent \
              || { echo "::error::tag v$VERSION does not exist"; exit 1; }
            [[ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == false ]] \
              || { echo "::error::release v$VERSION is a draft"; exit 1; }
            NAME=fil-$VERSION-arm64.tar.gz
            mkdir "$RUNNER_TEMP/release"
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$NAME.sha256" --dir "$RUNNER_TEMP/release"
            read -r SHA FILE < "$RUNNER_TEMP/release/$NAME.sha256"
            FILE=${FILE#\*}
            [[ $FILE == "$NAME" ]] || { echo "::error::checksum file names '$FILE', not $NAME"; exit 1; }
          else
            SHA=$BUILD_SHA256
          fi
          [[ $SHA =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          # GitHub's own SSH host keys, not trust-on-first-use. Authenticated: anonymous API calls from the
          # runner's shared address are refused or rate-limited (403).
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          [[ -s "$RUNNER_TEMP/known_hosts" ]] || { echo "::error::no GitHub host keys"; exit 1; }
          SSH="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$SSH" >> "$GITHUB_ENV"
          # The tap is public: clone it over HTTPS. Homebrew runs git with a filtered environment, so
          # GIT_SSH_COMMAND would not reach it; the key is used only by the plain `git push` below.
          brew tap productdevbook/tap https://github.com/productdevbook/homebrew-tap.git
          echo "TAP=$(brew --repository productdevbook/tap)" >> "$GITHUB_ENV"

      - name: Write the cask
        run: |
          CASK=$TAP/Casks/fil.rb
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/fil.rb.in > "$CASK"
          grep -qxF "  version \"$VERSION\"" "$CASK" || { echo "::error::version not written"; exit 1; }
          grep -qxF "  sha256 \"$SHA256\"" "$CASK" || { echo "::error::sha256 not written"; exit 1; }
          ! grep -q '@[A-Z0-9]*@' "$CASK" || { echo "::error::placeholder left in cask"; exit 1; }
          git -C "$TAP" diff --stat

      - name: Audit the cask
        run: brew audit --cask --strict --online productdevbook/tap/fil

      # Also exercises Gatekeeper on a quarantined download of the published tarball.
      - name: Install smoke test
        run: |
          brew install --cask productdevbook/tap/fil
          [[ "$(fil --version)" == "fil $VERSION" ]]
          fil scan "$RUNNER_TEMP" --porcelain | grep -q '^mode=full '
          brew uninstall --cask fil

      - name: Push the cask
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git -C "$TAP" commit -m "fil $VERSION" -- Casks/fil.rb
          git -C "$TAP" push git@github.com:productdevbook/homebrew-tap.git HEAD:main

      - name: Remove the tap key
        if: always()
        run: rm -rf "$RUNNER_TEMP/tap_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/release"
