name: Release

# Push a tag `vX.Y.Z` whose version matches Sources/fil/main.swift. The workflow tests, builds, signs and
# notarizes `fil`, publishes the GitHub release and updates the cask in productdevbook/homebrew-tap.
# Only tag pushes run it, so pull requests never see the signing secrets. A manual run (Actions tab)
# tests, builds, signs and notarizes the current version and uploads the tarball as an artifact; it
# publishes nothing (jobs `publish` and `tap` are skipped).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Same image as ci.yml: the only hosted one with the macOS 27 SDK.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer

jobs:
  # Nothing is signed unless the release build and the unit tests pass on this commit.
  test:
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then V=${GITHUB_REF_NAME#v}
          else V=$(sed -n 's/^let version = "\(.*\)"$/\1/p' Sources/fil/main.swift); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  build:
    needs: test
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.test.outputs.version }}
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FIL_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FIL_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export FIL_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8
          printf '%s' "$ASC_KEY_P8" > "$FIL_NOTARY_KEY"
          scripts/release.sh "$VERSION"

      - name: Checksum
        id: sum
        run: echo "sha256=$(cut -d' ' -f1 "dist/fil-$VERSION-arm64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      # For a tag, `publish` downloads this; for a manual run it is the result to inspect.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/fil-${{ env.VERSION }}-arm64.tar.gz
            dist/fil-${{ env.VERSION }}-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

  publish:
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Verify the checksum
        run: cd dist && sha256sum -c "fil-$VERSION-arm64.tar.gz.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=fil-$VERSION-arm64
          SHA=$(cut -d' ' -f1 dist/$NAME.tar.gz.sha256)
          gh release create "$GITHUB_REF_NAME" dist/$NAME.tar.gz dist/$NAME.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "fil $VERSION" --verify-tag --generate-notes \
            --notes "Signed with a Developer ID and notarized by Apple.

          \`\`\`sh
          brew install --cask productdevbook/tap/fil
          \`\`\`

          SHA-256 ($NAME.tar.gz): \`$SHA\`"

  tap:
    needs: [test, build, publish]
    if: github.ref_type == 'tag'
    runs-on: xcode-27
    timeout-minutes: 20
    permissions: {}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          # GitHub's own SSH host keys, not trust-on-first-use.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          [[ -s "$RUNNER_TEMP/known_hosts" ]] || { echo "::error::no GitHub host keys"; exit 1; }
          SSH="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$SSH" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND=$SSH
          brew tap productdevbook/tap git@github.com:productdevbook/homebrew-tap.git
          echo "TAP=$(brew --repository productdevbook/tap)" >> "$GITHUB_ENV"

      - name: Write the cask
        run: |
          CASK=$TAP/Casks/fil.rb
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/fil.rb.in > "$CASK"
          grep -qxF "  version \"$VERSION\"" "$CASK" || { echo "::error::version not written"; exit 1; }
          grep -qxF "  sha256 \"$SHA256\"" "$CASK" || { echo "::error::sha256 not written"; exit 1; }
          ! grep -q '@[A-Z0-9]*@' "$CASK" || { echo "::error::placeholder left in cask"; exit 1; }
          git -C "$TAP" diff --stat

      - name: Audit the cask
        run: brew audit --cask --strict --online productdevbook/tap/fil

      # Also exercises Gatekeeper on a quarantined download of the published tarball.
      - name: Install smoke test
        run: |
          brew install --cask productdevbook/tap/fil
          [[ "$(fil --version)" == "fil $VERSION" ]]
          fil scan "$RUNNER_TEMP" --porcelain | grep -q '^mode=full '
          brew uninstall --cask fil

      - name: Push the cask
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git -C "$TAP" commit -m "fil $VERSION" -- Casks/fil.rb
          git -C "$TAP" push origin HEAD:main

      - name: Remove the tap key
        if: always()
        run: rm -f "$RUNNER_TEMP/tap_key" "$RUNNER_TEMP/known_hosts"
